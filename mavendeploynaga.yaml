apiVersion: apps/v1
kind: Deployment
metadata:
  name: mavenwebappdeploy
  namespace: ${NAMESPACE}       # Parameterized namespace
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: mavenwebapp
  template:
    metadata:
      labels:
        app: mavenwebapp
    spec:
      containers:
      - name: mavenwebappcontainer
        image: dhanvikahandson/maven-web-application:${IMAGE_TAG}   # Parameterized Docker tag
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mavenwebappsvc
  namespace: ${NAMESPACE}       # Parameterized namespace
spec:
  type: NodePort
  selector:
    app: mavenwebapp
  ports:
    - port: 80
      targetPort: 8080
